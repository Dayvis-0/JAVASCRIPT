        <h1>Object</h1>
        <!--Un objeto es una colección de propiedades, y una propiedad es una asociacion entre un 
        nombre (o clave) y un valor. El valor de una propiedad puede ser una función, en cuyo caso
        la propiedad se conoce como método.-->
        <p>
            An object is a collection of properties, and a property is an association between a name
            (or keys) and values. A property's value can be a function, in which case the property
            is known as a method.
        </p>
